[project]
name = "maximo-ai-agents"
version = "0.1.0"
description = "Agentes de IA para análise de ordens de serviço no IBM Maximo (MAS 9.2), somente leitura"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maximo_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Jython 2.7 inside Maximo: no f-strings or py3-only syntax; SQL uses whitelisted
# columns and bind placeholders only.
"maximo_scripts/**" = ["UP", "B904", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
